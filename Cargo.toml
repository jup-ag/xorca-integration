[package]
name = "jup-xorca-integration"
version = "0.1.0"
edition = "2024"
description = "Jupiter AMM interface integration for Xorca Protocol on Solana"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/jup-xorca-integration"

[dependencies]
# Error Handling: Industry standards for clean error propagation
anyhow = "1.0.100"
thiserror = "2.0.17"

# Solana & Jupiter: Essential SDKs for AMM integration
solana-sdk = "2.3.1"
jupiter-amm-interface = "0.6.0"

# Math & Protocol: Precise decimal handling and Xorca core logic
rust_decimal = { version = "1.36.0", features = ["serde-float"] } # Optimization: Enable Serde if needed
xorca = "0.1.4"

# Optional Performance Additions
# lru = "0.12"      # For caching swap quotes
# serde = { version = "1.0", features = ["derive"] }

[profile.release]
# Optimization for Solana Programs / CLI tools
opt-level = 3        # Full optimization
lto = "fat"          # Link Time Optimization for maximum performance
codegen-units = 1    # Better optimization at the cost of slower build time
panic = "abort"      # Smaller binary size and better security (no stack unwinding)
strip = true         # Removes symbols (Security: makes reverse engineering harder)

